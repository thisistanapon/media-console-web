# Let's inspect the exact prompt text near the end to see where it cut off.
prompt_text = """<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATUM — Data &amp; Analytics Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DATUM — Data & Analytics Consulting
   High-fidelity visual mockup, 5 pages
   ============================================================ */

:root{
  --ink:#000000;
  --blue:#2558FF;
  --blue-deep:#001C78;
  --blue-tint:#EEF2FF;
  --white:#FFFFFF;
  --gray:#606060;
  --gray-mute:#9A9A9A;
  --surface:#F6F7F9;
  --line:#E4E6EB;
  --line-inv:rgba(255,255,255,.16);
  --r-card:24px;
  --r-input:8px;
  --fast:160ms;
  --base:240ms;
  --slow:400ms;
  --reveal:600ms;
  --ease:cubic-bezier(.2,0,0,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:#DCDEE3;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--blue);color:#fff}

/* ---------- review chrome ---------- */
.chrome{
  position:sticky;top:0;z-index:900;
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;height:44px;padding:0 20px;
  background:#0B0B0C;color:#fff;
}
.chrome b{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.chrome span{color:#7A7A80;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.vtoggle{display:flex;gap:2px;background:#1C1C20;border-radius:6px;padding:2px}
.vtoggle button{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 14px;border-radius:4px;color:#8A8A90;transition:var(--fast);
}
.vtoggle button.on{background:var(--blue);color:#fff}

/* ---------- viewport (container query root) ---------- */
.stage{padding:0;transition:padding var(--base) var(--ease)}
.stage.mobile{padding:28px 0 48px}
.viewport{
  container-type:inline-size;
  width:100%;margin:0 auto;background:var(--white);
  transition:width var(--base) var(--ease);
}
.stage.mobile .viewport{
  width:392px;border-radius:36px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.28),0 0 0 10px #16161A;
}

/* ---------- layout ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:0 80px}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.sec{padding:160px 0}
.sec--min{padding:128px 0}
.dark{background:var(--ink);color:#fff}
.tint{background:var(--surface)}
.hair{height:1px;background:var(--line);border:0}
.dark .hair{background:var(--line-inv)}

/* ---------- type ---------- */
.label{
  font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gray);display:flex;align-items:center;gap:10px;
}
.label::before{content:"";width:7px;height:7px;background:var(--blue);flex:none}
.label.plain::before{display:none}
.dark .label{color:#8E8E96}
.dxl{font-size:clamp(38px,5.6cqi,76px);font-weight:600;line-height:1.02;letter-spacing:-.035em}
.dl{font-size:clamp(33px,4.5cqi,60px);font-weight:600;line-height:1.06;letter-spacing:-.03em}
.h1{font-size:clamp(29px,3.6cqi,48px);font-weight:600;line-height:1.1;letter-spacing:-.025em}
.h2{font-size:clamp(26px,3cqi,40px);font-weight:600;line-height:1.15;letter-spacing:-.022em}
.h3{font-size:clamp(21px,2.1cqi,28px);font-weight:600;line-height:1.25;letter-spacing:-.015em}
.h4{font-size:19px;font-weight:500;line-height:1.35;letter-spacing:-.01em}
.lead{font-size:clamp(16px,1.35cqi,18px);line-height:1.65;color:var(--gray)}
.body{font-size:16px;line-height:1.72;color:var(--gray)}
.small{font-size:15px;line-height:1.6;color:var(--gray)}
.cap{font-size:13px;line-height:1.5;color:var(--gray-mute)}
.dark .lead,.dark .body,.dark .small{color:#A6A6AE}
.blue{color:var(--blue)}
.quote{font-size:clamp(21px,2.4cqi,32px);line-height:1.42;letter-spacing:-.015em;font-weight:400}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-mute)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 26px;
  border-radius:var(--r-input);font-size:15px;font-weight:500;letter-spacing:-.01em;
  transition:background var(--fast),color var(--fast),border-color var(--fast),transform var(--fast);
}
.btn:active{transform:scale(.98)}
.btn svg{transition:transform var(--fast) var(--ease)}
.btn:hover svg{transform:translateX(4px)}
.btn--pri{background:var(--blue);color:#fff}
.btn--pri:hover{background:var(--blue-deep)}
.btn--sec{border:1px solid var(--ink);color:var(--ink)}
.btn--sec:hover{background:var(--ink);color:#fff}
.btn--inv{background:#fff;color:var(--blue)}
.btn--inv:hover{background:var(--blue-deep);color:#fff}
.btn--oinv{border:1px solid rgba(255,255,255,.4);color:#fff}
.btn--oinv:hover{background:#fff;color:var(--ink);border-color:#fff}
.tlink{
  display:inline-flex;align-items:center;gap:8px;color:var(--blue);
  font-size:15px;font-weight:500;position:relative;padding-bottom:3px;
}
.tlink::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--blue);transition:width var(--base) var(--ease)}
.tlink:hover::after{width:100%}
.tlink:hover svg{transform:translateX(4px)}
.tlink svg{transition:transform var(--fast) var(--ease)}

/* ---------- nav ---------- */
.nav{
  position:sticky;top:0;z-index:100;height:82px;
  display:flex;align-items:center;
  transition:height var(--base) var(--ease),background var(--base) var(--ease),box-shadow var(--base);
}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;width:100%}
.nav.solid{height:66px;background:#fff;box-shadow:0 1px 0 var(--line)}
.mark{font-size:20px;font-weight:600;letter-spacing:-.03em;color:#fff;transition:color var(--base)}
.mark i{color:var(--blue);font-style:normal}
.nav.solid .mark{color:var(--ink)}
.navlinks{display:flex;align-items:center;gap:40px}
.navlinks a{
  font-size:15px;font-weight:400;color:rgba(255,255,255,.82);position:relative;padding:6px 0;
  transition:color var(--fast);
}
.nav.solid .navlinks a{color:var(--gray)}
.navlinks a:hover{color:#fff}
.nav.solid .navlinks a:hover{color:var(--ink)}
.navlinks a::after{content:"";position:absolute;left:50%;bottom:-4px;height:1px;width:0;background:var(--blue);transition:width var(--base) var(--ease),left var(--base) var(--ease)}
.navlinks a.on{color:#fff}
.nav.solid .navlinks a.on{color:var(--ink)}
.navlinks a.on::after{width:20px;left:calc(50% - 10px)}
.nav .btn{height:42px;padding:0 20px;font-size:14px}
.progress{position:absolute;left:0;bottom:0;height:2px;background:var(--blue);width:0;transition:width 80ms linear}
.burger{display:none;width:26px;height:16px;position:relative}
.burger i{position:absolute;left:0;height:1.5px;width:100%;background:#fff;transition:var(--base) var(--ease)}
.nav.solid .burger i{background:var(--ink)}
.burger i:nth-child(1){top:0}
.burger i:nth-child(2){bottom:0}
.nav.open .burger i:nth-child(1){top:7px;transform:rotate(45deg)}
.nav.open .burger i:nth-child(2){bottom:7px;transform:rotate(-45deg)}
.drawer{
  position:absolute;top:100%;left:0;right:0;background:#fff;
  border-top:1px solid var(--line);padding:32px 24px 28px;
  display:none;flex-direction:column;gap:4px;
}
.nav.open .drawer{display:flex}
.drawer a{font-size:26px;font-weight:500;letter-spacing:-.02em;padding:12px 0;color:var(--ink)}
.drawer a.on{color:var(--blue)}
.drawer .btn{margin-top:20px;width:100%;justify-content:center;height:52px}

/* ---------- hero ---------- */
.hero{background:var(--ink);color:#fff;margin-top:-82px;padding:200px 0 120px;position:relative;overflow:hidden}
.hero--light{background:#fff;color:var(--ink);padding:190px 0 96px;margin-top:-82px;border-bottom:1px solid var(--line)}
.hero--light .label{color:var(--gray)}

/* ---------- figure ---------- */
.fig{border:1px solid var(--line);border-radius:var(--r-card);padding:28px;background:#fff}
.dark .fig{border-color:var(--line-inv);background:#0A0A0B}
.figcap{margin-top:14px;display:flex;justify-content:space-between;align-items:center}

/* ---------- placeholder media ---------- */
.ph{
  position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--surface);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px;
  display:flex;align-items:flex-end;padding:22px;
}
.ph::before{content:"";position:absolute;top:22px;left:22px;width:22px;height:22px;border-top:1.5px solid var(--blue);border-left:1.5px solid var(--blue)}
.ph em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gray-mute)}
.ph--21x9{aspect-ratio:21/9}
.ph--16x7{aspect-ratio:16/7}
.ph--3x2{aspect-ratio:3/2}
.ph--4x3{aspect-ratio:4/3}
.ph--4x5{aspect-ratio:4/5;filter:grayscale(1);transition:filter var(--slow)}
.frame{border-radius:var(--r-card);overflow:hidden}
.frame .ph{border-radius:0;transition:transform var(--reveal) var(--ease)}

/* ---------- cards ---------- */
.card{
  border:1px solid var(--line);border-radius:var(--r-card);background:#fff;padding:48px;
  transition:border-color var(--base),box-shadow var(--base);
}
.card:hover{border-color:var(--blue);box-shadow:0 8px 24px rgba(0,28,120,.07)}
.card .ico{width:40px;height:40px;margin-bottom:34px;color:var(--ink);transition:color var(--base)}
.card:hover .ico{color:var(--blue)}
.card .arw{margin-top:34px;color:var(--blue);display:flex;transition:transform var(--base) var(--ease)}
.card:hover .arw{transform:translateX(5px)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:0 32px;border-left:1px solid var(--line)}
.stat:first-child{padding-left:0;border-left:0}
.dark .stat{border-color:var(--line-inv)}
.stat .n{font-size:clamp(38px,4.8cqi,64px);font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{margin-top:14px;font-size:13px;line-height:1.45;color:var(--gray)}
.dark .stat .l{color:#8E8E96}

/* ---------- list rows ---------- */
.row{
  display:grid;grid-template-columns:56px 1fr auto 56px;align-items:center;gap:24px;
  padding:30px 0;border-top:1px solid var(--line);transition:padding-left var(--base) var(--ease);
}
.row:last-child{border-bottom:1px solid var(--line)}
.row .idx{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gray-mute)}
.row .nm{font-size:clamp(19px,1.9cqi,26px);font-weight:500;letter-spacing:-.02em;transition:color var(--fast)}
.row .ct{font-size:14px;color:var(--gray)}
.row .ar{color:var(--line);display:flex;justify-content:flex-end;transition:color var(--fast),transform var(--base) var(--ease)}
.row:hover{padding-left:14px}
.row:hover .nm{color:var(--blue)}
.row:hover .ar{color:var(--blue);transform:translateX(5px)}

/* ---------- process ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;position:relative;padding-top:44px}
.steps::before{content:"";position:absolute;top:7px;left:0;right:0;height:1px;background:var(--line-inv)}
.steps::after{content:"";position:absolute;top:7px;left:0;height:1px;background:var(--blue);width:0;transition:width 900ms var(--ease)}
.steps.in::after{width:100%}
.step{position:relative}
.step::before{content:"";position:absolute;top:-41px;left:0;width:9px;height:9px;background:var(--blue)}
.step .sn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--blue);margin-bottom:14px}

/* ---------- work cards ---------- */
.pj{display:block}
.pj .frame{margin-bottom:22px}
.pj:hover .ph{transform:scale(1.035)}
.pj .t{font-size:20px;font-weight:500;letter-spacing:-.015em;line-height:1.35;margin:8px 0 12px;transition:color var(--fast)}
.pj:hover .t{color:var(--blue)}
.pj .m{font-size:15px;color:var(--gray);padding-top:12px;position:relative}
.pj .m::before{content:"";position:absolute;top:0;left:0;height:1px;width:100%;background:var(--line)}
.pj .m::after{content:"";position:absolute;top:0;left:0;height:1px;width:0;background:var(--blue);transition:width var(--slow) var(--ease)}
.pj:hover .m::after{width:100%}
.tag{font-size:11.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap}
.pill{
  height:42px;padding:0 20px;border:1px solid var(--line);border-radius:999px;
  font-size:14px;color:var(--gray);display:inline-flex;align-items:center;gap:7px;
  transition:var(--fast);
}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill s{text-decoration:none;color:var(--gray-mute);font-size:12px}
.pill.on s{color:rgba(255,255,255,.55)}
.pjcard{transition:opacity var(--base),transform var(--base)}
.pjcard.out{display:none}

/* ---------- forms ---------- */
.form{background:var(--surface);border-radius:var(--r-card);padding:48px}
.field{margin-bottom:22px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:9px}
.field label s{text-decoration:none;color:var(--blue)}
.field input,.field select,.field textarea{
  width:100%;height:52px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r-input);
  background:#fff;font-family:inherit;font-size:15px;color:var(--ink);transition:var(--fast);
}
.field textarea{height:132px;padding:15px 16px;resize:vertical;line-height:1.6}
.field input::placeholder,.field textarea::placeholder{color:var(--gray-mute)}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint);
}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.check{display:flex;gap:12px;align-items:flex-start;margin:26px 0}
.check i{width:20px;height:20px;border:1px solid var(--line);border-radius:4px;background:#fff;flex:none;margin-top:1px}

/* ---------- accordion ---------- */
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;text-align:left;font-size:18px;font-weight:500;letter-spacing:-.015em;transition:color var(--fast)}
.acc button:hover{color:var(--blue)}
.acc .pm{width:16px;height:16px;position:relative;flex:none;transition:transform var(--slow) var(--ease)}
.acc .pm::before,.acc .pm::after{content:"";position:absolute;background:var(--blue);inset:0;margin:auto}
.acc .pm::before{width:16px;height:1.5px}
.acc .pm::after{width:1.5px;height:16px}
.acc.open .pm{transform:rotate(45deg)}
.acc .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--slow) var(--ease)}
.acc.open .ans{grid-template-rows:1fr}
.acc .ans>div{overflow:hidden}
.acc .ans p{padding-bottom:30px;max-width:70ch}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-columns:96px 1fr;column-gap:0}
.tl .yr{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--gray);padding:34px 0}
.tl .ev{border-left:1px solid var(--line);padding:34px 0 34px 40px;position:relative}
.tl .ev::before{content:"";position:absolute;left:-4.5px;top:40px;width:9px;height:9px;background:var(--blue)}
.tl .ev h4{font-size:19px;font-weight:500;letter-spacing:-.015em;margin-bottom:8px}

/* ---------- map ---------- */
.map{
  aspect-ratio:4/3;border-radius:var(--r-card);background:var(--surface);position:relative;overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:38px 38px;
}
.map i{position:absolute;left:50%;top:48%;width:13px;height:13px;background:var(--blue);border-radius:50%;box-shadow:0 0 0 7px rgba(37,88,255,.16)}
.map a{position:absolute;left:22px;bottom:22px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 15px;font-size:13px;font-weight:500;transition:var(--fast)}
.map a:hover{border-color:var(--blue);color:var(--blue)}

/* ---------- marquee ---------- */
.mq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mqt{display:flex;gap:80px;width:max-content;animation:mq 34s linear infinite}
.mq:hover .mqt{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mqt span{font-size:19px;font-weight:600;letter-spacing:-.02em;color:#C2C4CA;white-space:nowrap;transition:color var(--base)}
.mqt span:hover{color:var(--ink)}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);padding:96px 0 44px}
.foot h5{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin-bottom:22px}
.foot a{display:block;font-size:15px;color:var(--ink);padding:7px 0;transition:color var(--fast)}
.foot a:hover{color:var(--blue)}
.foot .btm{display:flex;justify-content:space-between;align-items:center;margin-top:64px;padding-top:30px;border-top:1px solid var(--line);font-size:13px;color:var(--gray-mute)}
.foot .btm div{display:flex;gap:26px}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(16px);transition:opacity var(--reveal) var(--ease),transform var(--reveal) var(--ease)}
.rv.in{opacity:1;transform:none}

/* ---------- pages ---------- */
.page{display:none}
.page.on{display:block}

/* ---------- responsive (container queries) ---------- */
@container (max-width:1279px){ .wrap{padding:0 48px} .card{padding:40px} }
@container (max-width:1023px){
  .wrap{padding:0 40px}
  .sec{padding:112px 0}.sec--min{padding:96px 0}
  .navlinks,.nav>.wrap>.btn{display:none}
  .burger{display:block}
  .steps{grid-template-columns:repeat(2,1fr);row-gap:48px}
  .hero{padding:170px 0 96px}
  .form{padding:40px}
}
@container (max-width:767px){
  .wrap{padding:0 24px}
  .sec{padding:80px 0}.sec--min{padding:72px 0}
  .g{gap:16px}
  .card{padding:32px;border-radius:20px}
  .hero{padding:132px 0 72px}
  .hero--light{padding:128px 0 64px}
  .stats{grid-template-columns:1fr 1fr;gap:32px 0}
  .stat{padding:0 0 0 22px}
  .stat:nth-child(3){border-left:0;padding-left:0}
  .stat:nth-child(odd){border-left:0;padding-left:0}
  .steps{grid-template-columns:1fr;row-gap:0;padding-top:0;padding-left:26px}
  .steps::before{top:0;left:4px;right:auto;bottom:0;width:1px;height:auto}
  .steps::after{display:none}
  .step{padding:24px 0}
  .step::before{top:30px;left:-26px}
  .row{grid-template-columns:34px 1fr 26px;padding:22px 0}
  .row .ct{display:none}
  .pair{grid-template-columns:1fr;gap:0}
  .tl{grid-template-columns:66px 1fr}
  .tl .ev{padding-left:26px}
  .form{padding:28px;border-radius:20px}
  .foot{padding:64px 0 32px}
  .foot .btm{flex-direction:column;gap:18px;align-items:flex-start}
  .acc button{font-size:16px;padding:22px 0}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .filters::-webkit-scrollbar{display:none}
  .pill{flex:none}
  .fig{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:1ms!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<style>
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}
.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}
.s10{grid-column:span 10}.s12{grid-column:span 12}
.st2{grid-column-start:2}.st7{grid-column-start:7}.st8{grid-column-start:8}.st9{grid-column-start:9}
@container (max-width:1023px){
  .s3,.s4{grid-column:span 6}
  .s5,.s7,.s8,.s9,.s10{grid-column:span 12}
  .st2,.st7,.st8,.st9{grid-column-start:auto}
}
@container (max-width:767px){
